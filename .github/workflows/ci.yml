
name: WebApp API CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Tests and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        working-directory: backend
        run: ruff check main.py tests/

      - name: Run Pytest with coverage
        run: |
          PYTHONPATH=backend pytest backend/tests \
            --cov=main \
            --cov-report=xml:backend/coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend-test:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/

  publish-artifact:
    name: Publish Versioned Artifact
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - frontend-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend/dist/

      - name: Package application
        run: |
          mkdir -p release
          tar -czf release/webapp-api-${GITHUB_SHA}.tar.gz \
            backend/main.py \
            backend/requirements.txt \
            frontend/dist \
            backend/Dockerfile \
            frontend/Dockerfile \
            docker-compose.yml

      - name: Upload versioned artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-api-${{ github.sha }}
          path: release/webapp-api-${{ github.sha }}.tar.gz
          if-no-files-found: error
