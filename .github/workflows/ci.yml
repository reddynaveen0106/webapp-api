
name: WebApp API CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:

  # 1. Backend Tests and Lint
  backend-test:
    name: Backend Tests and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff lint
        run: |
          ruff check backend/

      - name: Run backend tests with coverage
        run: |
          pytest backend/tests/ \
            --cov=backend \
            --cov-report=term \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml

  # 2. Frontend Lint and Build
  frontend-test:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # 3. Publish Versioned Artifact
  publish-artifact:
    name: Publish Versioned Artifact
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Create versioned artifact
        run: |
          mkdir -p release

          tar -czf release/webapp-api-${GITHUB_SHA}.tar.gz \
            backend/ \
            frontend/ \
            docker-compose.yml \
            .env.example \
            README.md

      - name: Upload versioned artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-api-${{ github.sha }}
          path: release/webapp-api-${{ github.sha }}.tar.gz

  # 4. Deploy to Test Environment
  deploy-test:
    name: Deploy to Test Environment

    needs:
      - backend-test
      - frontend-test
      - publish-artifact

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          docker compose \
            --env-file /home/naveen/webapp-api/.env.test \
            -p webapp-api-test \
            up -d --build

      - name: Wait for backend health
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:18088/health; then
              echo "Backend is healthy"
              exit 0
            fi

            echo "Waiting for backend... attempt $i"
            sleep 2
          done

          echo "Backend health check failed"
          docker compose -p webapp-api-test logs --tail=50 backend
          exit 1

      - name: Verify deployment
        run: |
          docker compose -p webapp-api-test ps

          curl --fail http://localhost:18088/health
          curl --fail --head http://localhost:18081
          curl --fail http://localhost:18081/api/todos
